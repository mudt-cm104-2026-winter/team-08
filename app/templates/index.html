<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading list</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <main>
    <h1>Reading list</h1>
    <p class="intro">Books we want to read.</p>

    <form class="add" action="/add" method="post">
      <input name="title" placeholder="Title" required autocomplete="off" autofocus>
      <input name="author" placeholder="Author" required autocomplete="off">
      <button type="submit">Add</button>
    </form>

    {% if entries %}
    <p class="count">Books on your list: {{ entries|length }}</p>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
        </tr>
      </thead>
      <tbody>
        {% for entry in entries %}
        <tr>
          <td>{{ entry.title }}</td>
          <td>{{ entry.author }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">No books yet.</p>
    {% endif %}
  </main>
</body>

</html>
